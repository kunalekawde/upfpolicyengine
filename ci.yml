name: ci
on: [push, pull_request]
jobs:
  build-test:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang-tidy
      - run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} -DUPF_DEMO_WARNINGS_AS_ERRORS=ON -DUPF_DEMO_CLANG_TIDY=ON
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure
      - run: cmake --build build --target format-check
  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake
      - run: cmake -S . -B build -DUPF_DEMO_SANITIZERS=address,undefined -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
  cxx11-and-coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake gcovr
      - run: cmake -S . -B build -DUPF_DEMO_COVERAGE=ON -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure
      - run: gcovr --root . --filter 'src/domain/' --filter 'src/application/' --txt-metric branch --exclude-throw-branches --exclude-unreachable-branches --fail-under-branch 90
  fuzz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cmake clang
      - run: cmake -S . -B build -DCMAKE_CXX_COMPILER=clang++ -DUPF_DEMO_BUILD_FUZZERS=ON
      - run: cmake --build build --parallel
      - run: ./build/tests/upf_input_fuzzer -runs=10000 tests/fuzz/corpus
