name: Restore repository structure

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bootstrap.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore exact committed tree
        shell: bash
        run: |
          set -euo pipefail
          base64 -d repo.tar.gz.b64 > /tmp/repository.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name repo.tar.gz.b64 -exec rm -rf {} +
          tar -xzf /tmp/repository.tar.gz
          rm repo.tar.gz.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: restore repository structure"
          git push origin HEAD:main
